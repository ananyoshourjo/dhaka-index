name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DHAKA_INDEX_DATA_DIR: ${{ github.workspace }}/.release-data

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release version
        run: node scripts/version.mjs check --tag "$GITHUB_REF_NAME"

      - name: Verify applications
        run: npm run verify

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi

          node scripts/version.mjs notes |
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Dhaka Index $GITHUB_REF_NAME" \
              --notes-file -
